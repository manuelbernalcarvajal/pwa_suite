name: Security & Malware Audit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  antivirus-scan:
    name: Antivirus & Webshell Scan (ClamAV)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install & Update ClamAV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clamav clamav-daemon
          sudo systemctl stop clamav-freshclam || true
          sudo freshclam

      - name: Scan repository for malware
        run: |
          clamscan -r --bell -i --exclude-dir="^.git" .

  secrets-scan:
    name: Secrets & Token Leak Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast-security-scan:
    name: Critical Vulnerability Audit (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Semgrep (Errors & Exploits only)
        run: |
          semgrep scan \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --config=p/php \
            --severity ERROR \
            --metrics=off \
            --error

  report-status:
    name: Report Security Status to PR
    needs: [antivirus-scan, secrets-scan, sast-security-scan]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Comment Security Approval
        if: needs.antivirus-scan.result == 'success' && needs.secrets-scan.result == 'success' && needs.sast-security-scan.result == 'success'
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '🛡️ **Auditoría de Seguridad Superada:** No se detectó malware, secretos filtrados ni vulnerabilidades críticas en este PR.'
              });
            } catch (err) {
              console.log('No se pudo comentar en el PR:', err.message);
            }

      - name: Comment Security Alert
        if: needs.antivirus-scan.result == 'failure' || needs.secrets-scan.result == 'failure' || needs.sast-security-scan.result == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: '🚨 **Alerta de Seguridad:** Se detectaron amenazas críticas o credenciales expuestas en el código.'
              });
            } catch (err) {
              console.log('No se pudo comentar en el PR:', err.message);
            }
