name: Code Style & Linting

on:
  pull_request:
    branches: [ main, master ]
  push:
    branches: [ main, master ]

jobs:
  php-cs:
    name: Code Standards Check (Informative)
    runs-on: ubuntu-latest
    continue-on-error: true # Permite que el PR continúe en verde aunque haya detalles menores
    steps:
      - uses: actions/checkout@v4
      
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: phpcs

      - name: Check PSR-12 compliance
        # -n ignora warnings; --ignore descarta plantillas y archivos estáticos
        run: phpcs -n --standard=PSR12 --ignore=templates/,css/,js/ lib/ appinfo/
